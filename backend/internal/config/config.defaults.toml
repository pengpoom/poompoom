# 默认配置（会被后端加载）。如需自定义配置：复制本文件为 `config.toml` 并修改。

[app]
name = "image-studio"
version = ""
api_key = ""
auth_key = "imagestudio"
image_format = "url"
max_upload_size_mb = 50

[server]
host = "0.0.0.0"
port = 7000
static_dir = "static"
max_image_concurrency = 8
image_queue_limit = 32
image_queue_timeout_seconds = 20

[chatgpt]
model = "gpt-image-2"
sse_timeout = 600
poll_interval = 3
poll_max_wait = 600
request_timeout = 120

[accounts]
default_quota = 5
prefer_remote_refresh = true
refresh_workers = 6
image_quota_refresh_ttl_seconds = 120

[database]
driver = "postgres"
dsn = "postgres://image_studio:image_studio@127.0.0.1:5432/image_studio?sslmode=disable"
max_open_conns = 20
max_idle_conns = 10
conn_max_lifetime_seconds = 300

[job_queue]
backend = "local"

[storage]
backend = "current"
config_backend = "file"
auth_dir = "data/auths"
state_file = "data/accounts_state.json"
sync_state_dir = "data/sync_state"
image_dir = "data/business-images"
image_storage = "browser"
image_conversation_storage = "browser"
image_data_storage = "browser"
sqlite_path = "data/image-studio.db"
redis_addr = "127.0.0.1:6379"
redis_password = ""
redis_db = 0
redis_prefix = "imagestudio:studio"

# 远端账号同步配置。
# 如果你暂时不需要远端号池同步，请保持 enabled=false。
[sync]
enabled = false
base_url = ""
management_key = ""
request_timeout = 20
concurrency = 4
provider_type = "codex"

# 固定代理配置。保留给需要代理访问远端服务的兼容场景。
# 当前仅支持 fixed 模式，url 支持 socks5 / socks5h / http / https。
# 如果 sync_enabled = true，同步请求也会复用同一代理。
[proxy]
enabled = false
url = "socks5h://127.0.0.1:10808"
mode = "fixed"
sync_enabled = false

# 统一 API 接入配置。当前先用于管理员页面录入与保存。
[api_access]
platform = "gpt-image"
base_url = ""
api_key = ""

[newapi]
base_url = ""
username = ""
password = ""
access_token = ""
user_id = 0
session_cookie = ""
request_timeout = 20

[sub2api]
base_url = ""
email = ""
password = ""
api_key = ""
group_id = ""
request_timeout = 20

[log]
log_all_requests = false
