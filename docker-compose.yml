name: ${COMPOSE_PROJECT_NAME:-image-studio}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_studio}
      POSTGRES_USER: ${POSTGRES_USER:-image_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  studio:
    image: ghcr.io/pengpoom/poomimage:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "7000:7000"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7000
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://${POSTGRES_USER:-image_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-image_studio}?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_SECONDS: ${DATABASE_CONN_MAX_LIFETIME_SECONDS:-300}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-redis}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-imagestudio:studio}
      APP_SESSION_TTL_HOURS: ${APP_SESSION_TTL_HOURS:-24}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TEST_USERNAME: ${TEST_USERNAME:-test}
      TEST_EMAIL: ${TEST_EMAIL:-test@example.com}
      TEST_PASSWORD: ${TEST_PASSWORD}
      IMAGE_STUDIO_UPDATER_URL: http://updater:7071
      IMAGE_STUDIO_UPDATER_TOKEN: ${IMAGE_STUDIO_UPDATER_TOKEN:-}
      IMAGE_STUDIO_VERSION_REPO: ${IMAGE_STUDIO_VERSION_REPO:-pengpoom/poomimage}
      IMAGE_STUDIO_GITHUB_TOKEN: ${IMAGE_STUDIO_GITHUB_TOKEN:-}
      REGISTRATION_SMTP_HOST: ${REGISTRATION_SMTP_HOST:-}
      REGISTRATION_SMTP_PORT: ${REGISTRATION_SMTP_PORT:-587}
      REGISTRATION_SMTP_USERNAME: ${REGISTRATION_SMTP_USERNAME:-}
      REGISTRATION_SMTP_PASSWORD: ${REGISTRATION_SMTP_PASSWORD:-}
      REGISTRATION_SMTP_FROM: ${REGISTRATION_SMTP_FROM:-}
      REGISTRATION_SMTP_FROM_NAME: ${REGISTRATION_SMTP_FROM_NAME:-ImageStudio}
      EXTERNAL_API_ENABLED: ${EXTERNAL_API_ENABLED:-false}
      EXTERNAL_API_BASE_URL: ${EXTERNAL_API_BASE_URL:-}
      EXTERNAL_API_SIGNING_SECRET: ${EXTERNAL_API_SIGNING_SECRET:-}
      EXTERNAL_API_DEFAULT_RATE_LIMIT_PER_MINUTE: ${EXTERNAL_API_DEFAULT_RATE_LIMIT_PER_MINUTE:-60}
      EXTERNAL_API_DEFAULT_CONCURRENCY_LIMIT: ${EXTERNAL_API_DEFAULT_CONCURRENCY_LIMIT:-2}
      TZ: ${TZ:-Asia/Shanghai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${IMAGE_STUDIO_DATA_DIR:-./backend/data}:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  updater:
    image: ghcr.io/pengpoom/poomimage:${IMAGE_TAG:-latest}
    command: ["/app/image-studio-updater"]
    environment:
      UPDATER_HOST: 0.0.0.0
      UPDATER_PORT: 7071
      IMAGE_STUDIO_UPDATER_TOKEN: ${IMAGE_STUDIO_UPDATER_TOKEN:-}
      IMAGE_STUDIO_DEPLOY_DIR: ${IMAGE_STUDIO_DEPLOY_DIR:-/deploy}
      IMAGE_STUDIO_COMPOSE_FILE: docker-compose.yml
      IMAGE_STUDIO_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-image-studio}
      IMAGE_STUDIO_COMPOSE_SERVICE: studio
      IMAGE_STUDIO_UPDATE_TIMEOUT_SECONDS: ${IMAGE_STUDIO_UPDATE_TIMEOUT_SECONDS:-900}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/root/.docker:ro
      - ${IMAGE_STUDIO_DEPLOY_DIR:-./}:${IMAGE_STUDIO_DEPLOY_DIR:-/deploy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
